[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "danubepulse"
version = "0.1.0"
description = "Austrian river, weather, and energy data intelligence with incident replay"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "altair>=5.5,<7",
  "fastapi>=0.115,<1",
  "pandas>=2.2,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.41,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=9.0.3,<10", "ruff>=0.9,<1"]
streaming = ["confluent-kafka==2.12.2"]

[project.scripts]
danubepulse = "danubepulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/danubepulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA_MODE: demo
  ENTSOE_API_TOKEN: ""
  ENTSOE_TERMS_ACCEPTED: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  publication-safety:
    name: Publication safety (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan secrets locally; redact all detected values
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.24.3
          git /repo --log-opts=--all --redact=100 --no-banner --log-level=error
      - name: Reject private/generated files in tree and reachable history
        if: ${{ always() }}
        run: |
          python3 scripts/check_publication.py
          python3 scripts/check_publication.py --history

  quality:
    name: Python 3.12 / SQLite and PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: danubepulse_test
          POSTGRES_USER: danubepulse
          POSTGRES_PASSWORD: ci-only-local-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U danubepulse -d danubepulse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Workflow syntax and static checks
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.7 .github/workflows/ci.yml
      - run: ruff check .
      - run: ruff format --check .
      - name: Tracked-file publication guard
        run: python scripts/check_publication.py
      - name: Offline application / API / Streamlit tests (SQLite)
        run: pytest -o addopts='' -q
      - name: Same contracts with migrated disposable PostgreSQL schemas
        run: pytest -o addopts='' -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://danubepulse:ci-only-local-test@localhost:5432/danubepulse_test
      - name: Validate base and all optional Compose profiles
        run: docker compose --profile airflow --profile lakehouse --profile kafka config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-local-test

  airflow:
    name: Airflow DAG contracts (no scheduler / provider requests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          docker run --rm --entrypoint python --network none \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            -v "$PWD/airflow/fixtures:/opt/airflow/fixtures:ro" \
            -v "$PWD/airflow/tests:/opt/airflow/tests:ro" \
            apache/airflow:3.3.2-python3.12 /opt/airflow/tests/check_dags.py

  lakehouse:
    name: Spark / Delta contracts (synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -f lakehouse/Dockerfile -t danubepulse-lakehouse .
      - name: Merge, schema, transaction, time-travel and scale contracts
        run: >-
          docker run --rm --network none --memory=3g --cpus=2 --entrypoint python
          danubepulse-lakehouse -m pytest lakehouse/tests -q

  streaming:
    name: Kafka / PostgreSQL failure and replay integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-only-streaming-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker compose --profile kafka build api streaming-publisher streaming-consumer
      - run: docker compose up -d --wait db api
      - run: docker compose --profile kafka run --rm kafka-init
      - name: Durable outbox during broker outage
        run: |
          docker compose --profile kafka stop kafka
          docker compose --profile kafka run --rm --no-deps \
            -v "$PWD/streaming/tests:/checks:ro" streaming-publisher \
            python /checks/check_kafka.py outage --key ci-notifications
      - name: Recovery, duplicate ACK gap, durable offsets and replay
        run: |
          docker compose --profile kafka up -d --wait kafka
          for phase in recover resume replay; do
            docker compose --profile kafka run --rm --no-deps \
              -v "$PWD/streaming/tests:/checks:ro" streaming-publisher \
              python /checks/check_kafka.py "$phase" --key ci-notifications
          done
      - name: Existing synthetic ingestion and incident recovery through Kafka
        run: |
          docker compose --profile kafka run --rm --no-deps \
            -v "$PWD/streaming/tests:/checks:ro" streaming-publisher \
            python /checks/check_pipeline_events.py
      - name: Stop CI-only services without deleting volumes
        if: ${{ always() }}
        run: docker compose --profile kafka stop
